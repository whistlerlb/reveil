<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2433">
<title>Réveil enfants</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --txt:#22222a; --mut:#6b6b74; --bord:#dedcd5; --acc:#3c6fd8; --sieste:#8a5cc7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181f; --card:#20232d; --txt:#ecebe6; --mut:#9a9aa3; --bord:#343846; --acc:#7da2f0; --sieste:#b28ae6; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width:440px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; font-weight:600; margin:4px 0 16px; }
  h2 { font-size:15px; font-weight:600; margin:0 0 4px; color:var(--mut); }
  .card { background:var(--card); border:1px solid var(--bord); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:10px 0; }
  label { color:var(--mut); font-size:15px; }
  input[type=time], input[type=number], select { font-size:18px; padding:6px 8px; border-radius:8px;
    border:1px solid var(--bord); background:var(--bg); color:var(--txt); width:120px; text-align:center; }
  input[type=range] { flex:1; }
  .lum { display:flex; align-items:center; gap:10px; margin:12px 0; }
  .dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .ts { font-size:13px; color:var(--mut); }
  .val { width:42px; text-align:right; font-variant-numeric:tabular-nums; }
  button { font-size:16px; border-radius:10px; border:1px solid var(--bord); background:var(--card);
    color:var(--txt); padding:10px 14px; }
  button.prim { width:100%; background:var(--acc); color:#fff; border:none; padding:14px; font-size:17px; }
  button.sieste { width:100%; background:var(--sieste); color:#fff; border:none; padding:12px; margin-top:6px; }
  button.mini { padding:6px 10px; font-size:14px; }
  button:disabled { opacity:.45; }
  #etat { font-size:15px; color:var(--mut); margin:0 0 14px; }
  #siesteInfo { font-size:15px; margin:8px 0 2px; }
  #batterie { font-size:15px; margin:0 0 14px; }
  #batterie.basse { color:#d0502c; font-weight:600; }
  progress { width:100%; height:14px; margin:10px 0 4px; }
  .petit { font-size:13px; color:var(--mut); margin:6px 0; }
  #msg { text-align:center; color:var(--mut); min-height:22px; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Réveil enfants</h1>
  <p id="etat">Non connecté</p>
  <p id="batterie" style="display:none"></p>
  <button class="prim" id="btnCo">Connecter</button>

  <div id="reglages" style="margin-top:14px; display:none">
    <div class="card">
      <h2>Sieste</h2>
      <div class="row"><label for="dureeSieste">Durée</label>
        <select id="dureeSieste">
          <option value="20">20 min</option><option value="30">30 min</option>
          <option value="45">45 min</option><option value="60">1 h</option>
          <option value="75">1 h 15</option><option value="90" selected>1 h 30</option>
          <option value="105">1 h 45</option><option value="120">2 h</option>
          <option value="150">2 h 30</option><option value="180">3 h</option>
        </select></div>
      <p id="siesteInfo" style="display:none"></p>
      <button class="sieste" id="btnSieste">Démarrer la sieste</button>
    </div>

    <div class="card">
      <h2>Nuit</h2>
      <div class="row"><label for="rs">Réveil lun – ven</label><input type="time" id="rs"></div>
      <div class="row"><label for="rw">Réveil sam – dim</label><input type="time" id="rw"></div>
      <div class="row"><label for="coucher">Coucher (rouge)</label><input type="time" id="coucher"></div>
      <div class="row"><label for="orange">Orange avant (min)</label><input type="number" id="orange" min="0" max="180"></div>
      <div class="row"><label for="vert">Vert pendant (min)</label><input type="number" id="vert" min="0" max="600"></div>
    </div>

    <div class="card">
      <h2>Luminosité</h2>
      <div class="lum"><span class="dot" style="background:#e0443e"></span>
        <input type="range" id="lr" min="1" max="100"><span class="val" id="lrV"></span>
        <button class="mini" data-p="r" data-k="lr">Tester</button></div>
      <div class="lum"><span class="dot" style="background:#f0952a"></span>
        <input type="range" id="lo" min="1" max="100"><span class="val" id="loV"></span>
        <button class="mini" data-p="o" data-k="lo">Tester</button></div>
      <div class="lum"><span class="dot" style="background:#4fa83a"></span>
        <input type="range" id="lv" min="1" max="100"><span class="val" id="lvV"></span>
        <button class="mini" data-p="v" data-k="lv">Tester</button></div>
    </div>

    <div class="card">
      <h2>Teinte de l'orange</h2>
      <div class="lum"><span class="ts">rouge</span>
        <input type="range" id="to" min="0" max="100"><span class="ts">jaune</span>
        <span class="val" id="toV"></span></div>
    </div>

    <button class="prim" id="btnSave">Enregistrer</button>

    <div class="card" id="carteMaj" style="display:none; margin-top:14px">
      <h2>Mise à jour du réveil</h2>
      <p class="petit" id="versionInfo"></p>
      <button id="btnMajLigne" style="width:100%; display:none"></button>
      <div class="row"><label for="fichierMaj">Ou un fichier .bin</label>
        <input type="file" id="fichierMaj" accept=".bin" style="width:180px"></div>
      <progress id="progMaj" max="1" value="0" style="display:none"></progress>
      <p class="petit" id="majInfo"></p>
    </div>
  </div>
  <p id="msg"></p>
</main>

<script>
const SERVICE = "6f1c0001-3b7a-4c55-9a2e-7d1e5a0c0001";
const CHAR    = "6f1c0002-3b7a-4c55-9a2e-7d1e5a0c0001";
const OTA     = "6f1c0003-3b7a-4c55-9a2e-7d1e5a0c0001";
const ETATS = ["éteint", "rouge", "orange", "vert", "heure inconnue"];
const $ = id => document.getElementById(id);
let carac = null, caracMaj = null, versionReveil = 0, majEnCours = false, enLigne = null, siesteActive = false, siesteReste = 0, minuteur = null;
const enc = new TextEncoder(), dec = new TextDecoder();
const pad = n => String(n).padStart(2, "0");
const minToTime = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const timeToMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const heureUTC = () => Math.floor(Date.now() / 1000);
const msg = t => $("msg").textContent = t;

// Fuseau du téléphone au format POSIX, pour que le réveil gère seul l'heure d'été.
// On cherche les deux prochains changements d'heure et on en déduit les règles.
function fuseauPosix() {
  const H = 3600e3, now = Date.now();
  const est = t => -new Date(t).getTimezoneOffset();          // minutes à l'est de UTC
  const fmt = m => {                                          // POSIX inverse le signe
    const a = Math.abs(m), s = m > 0 ? "-" : "";
    return s + Math.floor(a / 60) + (a % 60 ? ":" + pad(a % 60) : "");
  };
  const trans = [];
  let prev = est(now);
  for (let t = now + H; t < now + 400 * 24 * H && trans.length < 2; t += H) {
    const o = est(t);
    if (o !== prev) {
      let lo = t - H, hi = t;
      while (hi - lo > 60e3) { const mid = (lo + hi) / 2; if (est(mid) === prev) lo = mid; else hi = mid; }
      trans.push({ t: Math.round(hi / 60e3) * 60e3, de: prev, vers: o });
      prev = o;
    }
  }
  if (trans.length < 2) return { z: "STD" + fmt(est(now)), zs: "", ze: "" };
  const regle = tr => {
    const d = new Date(tr.t + tr.de * 60e3);                  // heure locale juste avant le changement
    const mois = d.getUTCMonth() + 1, jour = d.getUTCDate();
    const nbJours = new Date(Date.UTC(d.getUTCFullYear(), mois, 0)).getUTCDate();
    const sem = jour + 7 > nbJours ? 5 : Math.ceil(jour / 7);
    const h = d.getUTCHours(), mi = d.getUTCMinutes();
    const heure = (h === 2 && mi === 0) ? "" : "/" + h + (mi ? ":" + pad(mi) : "");
    return "M" + mois + "." + sem + "." + d.getUTCDay() + heure;
  };
  const debut = trans.find(t => t.vers > t.de), fin = trans.find(t => t.vers < t.de);
  const std = fin.vers, dst = debut.vers;
  return { z: "STD" + fmt(std) + "DST" + (dst - std === 60 ? "" : fmt(dst)), zs: regle(debut), ze: regle(fin) };
}

async function envoyer(cle, val) {
  await carac.writeValueWithResponse(enc.encode(cle + "=" + val));
}

async function synchroHeure() {
  const f = fuseauPosix();
  await envoyer("z", f.z);
  await envoyer("zs", f.zs);
  await envoyer("ze", f.ze);
  await envoyer("t", heureUTC());
}

function afficherSieste(reste) {
  siesteActive = reste !== 0;
  siesteReste = reste;
  $("btnSieste").textContent = !siesteActive ? "Démarrer la sieste"
    : reste > 600 ? "Arrêter la sieste (orange 5 min)"
    : reste > 0 ? "Passer au vert maintenant" : "Terminer la sieste";
  $("dureeSieste").disabled = siesteActive;
  $("siesteInfo").style.display = siesteActive ? "" : "none";
  if (!siesteActive) return;
  const fin = new Date(Date.now() + reste * 1000);
  const hFin = pad(fin.getHours()) + ":" + pad(fin.getMinutes());
  $("siesteInfo").textContent = reste > 600 ? "Sieste en cours · vert à " + hFin
    : reste > 0 ? "Orange · vert à " + hFin
    : "Sieste terminée · vert encore quelques minutes";
}

// Pourcentage approximatif d'une LiPo 3,7 V au repos (tension en mV)
const COURBE = [[3300, 0], [3610, 5], [3690, 10], [3710, 15], [3730, 20], [3770, 30], [3800, 40],
                [3840, 50], [3870, 60], [3950, 70], [4020, 80], [4110, 90], [4200, 100]];
function pourcent(mv) {
  if (mv <= COURBE[0][0]) return 0;
  for (let i = 1; i < COURBE.length; i++) {
    const [v1, p1] = COURBE[i - 1], [v2, p2] = COURBE[i];
    if (mv <= v2) return Math.round(p1 + (p2 - p1) * (mv - v1) / (v2 - v1));
  }
  return 100;
}

function afficherBatterie(mv, bas) {
  const b = $("batterie");
  b.style.display = "";
  b.className = bas ? "basse" : "";
  if (mv < 3000) { b.textContent = "Batterie : non détectée (sur USB)"; return; }
  const v = (mv / 1000).toFixed(2).replace(".", ",");
  b.textContent = mv > 4250 ? "Batterie : en charge (" + v + " V)"
    : "Batterie : " + pourcent(mv) + " % (" + v + " V)" + (bas ? " · faible, à recharger" : "");
}

async function lire() {
  if (majEnCours) return;
  const champs = dec.decode(await carac.readValue()).split(",").map(Number);
  const [t, c, rs, rw, o, vd, lr, lo, lv, e, to, sieste, version, mv, bas] = champs;
  versionReveil = version || 3;
  if (champs.length > 13) afficherBatterie(mv, bas === 1);
  afficherVersion();
  $("coucher").value = minToTime(c);
  $("rs").value = minToTime(rs);
  $("rw").value = minToTime(rw);
  $("orange").value = o;
  $("vert").value = vd;
  for (const [k, x] of [["lr", lr], ["lo", lo], ["lv", lv]]) { $(k).value = x; $(k + "V").textContent = x + " %"; }
  $("to").value = to; $("toV").textContent = to;
  const d = new Date(t * 1000);
  $("etat").textContent = "Connecté · heure du réveil " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + " · " + ETATS[e];
  afficherSieste(sieste);
}

async function connecter() {
  try {
    msg("Recherche…");
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "Reveil" }], optionalServices: [SERVICE] });
    device.addEventListener("gattserverdisconnected", () => {
      clearInterval(minuteur);
      $("etat").textContent = "Déconnecté";
      $("reglages").style.display = "none";
      $("btnCo").style.display = "";
      $("batterie").style.display = "none";
      if (majEnCours) $("majInfo").textContent = "Connexion perdue pendant la mise à jour : le réveil garde l'ancienne version.";
      majEnCours = false;
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    carac = await service.getCharacteristic(CHAR);
    caracMaj = await service.getCharacteristic(OTA).catch(() => null);   // absente avant la v4
    $("carteMaj").style.display = caracMaj ? "" : "none";
    await synchroHeure();                         // heure + fuseau à chaque connexion
    await lire();
    $("reglages").style.display = "";
    $("btnCo").style.display = "none";
    msg("Heure synchronisée");
    minuteur = setInterval(() => lire().catch(() => {}), 30000);
  } catch (e) {
    msg("Erreur : " + e.message);
  }
}

async function enregistrer() {
  try {
    $("btnSave").disabled = true;
    msg("Envoi…");
    await synchroHeure();
    await envoyer("rs", timeToMin($("rs").value));
    await envoyer("rw", timeToMin($("rw").value));
    await envoyer("c", timeToMin($("coucher").value));
    await envoyer("o", $("orange").value);
    await envoyer("v", $("vert").value);
    await envoyer("lr", $("lr").value);
    await envoyer("lo", $("lo").value);
    await envoyer("lv", $("lv").value);
    await envoyer("to", $("to").value);
    await envoyer("s", 1);
    await lire();
    msg("Enregistré ✓");
  } catch (e) {
    msg("Erreur : " + e.message);
  } finally {
    $("btnSave").disabled = false;
  }
}

async function sieste() {
  try {
    $("btnSieste").disabled = true;
    const avant = siesteActive ? siesteReste : null;
    await envoyer("n", siesteActive ? 0 : $("dureeSieste").value);
    await lire();
    msg(avant === null ? "Bonne sieste !"
      : avant > 600 ? "Orange pendant 5 min, puis vert"
      : avant > 0 ? "Passage au vert" : "Sieste terminée");
  } catch (e) {
    msg("Erreur : " + e.message);
  } finally {
    $("btnSieste").disabled = false;
  }
}

// ---------- Mise à jour sans fil ----------

async function lireEtatMaj() {
  const f = dec.decode(await carac.readValue()).split(",").map(Number);
  return { etat: f[15], recu: f[16] };
}

async function chercherEnLigne() {
  try {
    const r = await fetch("firmware/version.json", { cache: "no-store" });
    if (r.ok) enLigne = await r.json();
  } catch (e) { enLigne = null; }
  afficherVersion();
}

function afficherVersion() {
  $("versionInfo").textContent = "Version du réveil : " + versionReveil +
    (enLigne ? " · dernière version : " + enLigne.version : "");
  const b = $("btnMajLigne");
  b.style.display = enLigne && enLigne.version > versionReveil && !majEnCours ? "" : "none";
  if (enLigne) b.textContent = "Installer la version " + enLigne.version;
}

async function installer(buf) {
  const octets = new Uint8Array(buf);
  if (octets[0] !== 0xE9) { $("majInfo").textContent = "Ce fichier n'est pas un programme ESP32 (.bin)."; return; }
  if (!confirm("Installer ce programme (" + Math.round(octets.length / 1024) + " ko) ? Gardez le téléphone près du réveil pendant 2 à 3 minutes.")) return;
  majEnCours = true;
  afficherVersion();
  const prog = $("progMaj"), info = $("majInfo");
  prog.style.display = ""; prog.value = 0;
  try {
    await envoyer("u", octets.length);
    if ((await lireEtatMaj()).etat !== 1) throw new Error("le réveil refuse la mise à jour (place insuffisante ?)");
    const T = 180, debut = Date.now();
    for (let i = 0, k = 0; i < octets.length; i += T, k++) {
      const morceau = octets.slice(i, i + T);
      // un paquet sur 16 avec accusé de réception : évite de saturer le réveil
      if (k % 16 === 15) await caracMaj.writeValueWithResponse(morceau);
      else await caracMaj.writeValueWithoutResponse(morceau);
      if (k % 16 === 15) {
        prog.value = i / octets.length;
        const s = (Date.now() - debut) / 1000 * (octets.length - i) / i;
        info.textContent = "Envoi… " + Math.round(i / octets.length * 100) + " % · encore " + Math.ceil(s / 60) + " min environ";
      }
    }
    prog.value = 1;
    info.textContent = "Vérification…";
    await envoyer("u", "fin");
    const r = await lireEtatMaj();
    if (r.etat !== 2) throw new Error("fichier incomplet ou invalide (" + r.recu + " / " + octets.length + " octets reçus)");
    info.textContent = "Mise à jour réussie ✓ Le réveil redémarre ; reconnectez-vous dans quelques secondes.";
  } catch (e) {
    info.textContent = "Échec : " + e.message + ". Le réveil garde l'ancienne version.";
    try { await envoyer("u", "annule"); } catch (_) {}
  } finally {
    majEnCours = false;
    afficherVersion();
  }
}

$("btnMajLigne").onclick = async () => {
  try {
    $("majInfo").textContent = "Téléchargement…";
    const r = await fetch(enLigne.fichier, { cache: "no-store" });
    if (!r.ok) throw new Error("fichier introuvable");
    await installer(await r.arrayBuffer());
  } catch (e) { $("majInfo").textContent = "Échec : " + e.message; }
};
$("fichierMaj").onchange = async () => {
  const f = $("fichierMaj").files[0];
  if (f) await installer(await f.arrayBuffer());
  $("fichierMaj").value = "";
};
chercherEnLigne();

if (!navigator.bluetooth) {
  msg("Ce navigateur ne gère pas le Bluetooth. Utilisez Chrome sur Android.");
  $("btnCo").disabled = true;
}
$("btnCo").onclick = connecter;
$("btnSave").onclick = enregistrer;
$("btnSieste").onclick = sieste;
for (const k of ["lr", "lo", "lv"]) $(k).oninput = () => $(k + "V").textContent = $(k).value + " %";
$("to").oninput = () => $("toV").textContent = $("to").value;
$("to").onchange = async () => {
  try { await envoyer("lo", $("lo").value); await envoyer("to", $("to").value); await envoyer("p", "o"); }
  catch (e) { msg("Erreur : " + e.message); }
};
document.querySelectorAll("button[data-p]").forEach(b => b.onclick = async () => {
  try { await envoyer(b.dataset.k, $(b.dataset.k).value); await envoyer("p", b.dataset.p); }
  catch (e) { msg("Erreur : " + e.message); }
});
</script>
</body>
</html>
